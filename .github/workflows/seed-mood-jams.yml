name: Seed Mood Jams

# One-time (or re-runnable) trigger for seed/seedMoodJams.js - replaces the placeholder
# "ג'אם לפי הרגע" categories with the real ones/songs provided by the owner. Deletes the
# categories not being replaced (party/love/road) and overwrites campfire/shabbat/soul with the
# real song lists. Safe to re-run: songs use deterministic ids, jam docs are full overwrites by
# fixed id. Trigger manually from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: seed

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/serviceAccountKey.json"
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Run seed script
        run: node seedMoodJams.js
        working-directory: seed
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/serviceAccountKey.json
